<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Redefinir senha — CineMeck</title>
<style>
  :root { --bg:#171722; --card:#1e1e2b; --vermelho:#E50914; --texto:#e8e8ee; --sub:#9b9ba6; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; background:var(--bg); color:var(--texto);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .card {
    width:100%; max-width:400px; background:var(--card);
    border:1px solid #2a2a3a; border-radius:18px; padding:28px 24px;
  }
  .logo { text-align:center; font-size:26px; font-weight:900; margin-bottom:6px; }
  .logo span { color:var(--vermelho); }
  h1 { font-size:18px; text-align:center; margin:0 0 20px; font-weight:800; }
  label { display:block; font-size:13px; color:var(--sub); margin:14px 0 6px; }
  input {
    width:100%; background:#15151f; border:1px solid #33333f; border-radius:12px;
    padding:14px; color:#fff; font-size:15px; outline:none;
  }
  input:focus { border-color:var(--vermelho); }
  button {
    width:100%; margin-top:22px; background:var(--vermelho); color:#fff;
    border:none; border-radius:12px; padding:15px; font-size:16px; font-weight:800; cursor:pointer;
  }
  button:disabled { opacity:0.6; }
  .msg { text-align:center; font-size:14px; margin-top:16px; min-height:20px; }
  .ok { color:#22C55E; }
  .erro { color:#ff6b6b; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">Cine<span>Meck</span></div>
    <h1>Redefinir senha</h1>

    <div id="form">
      <label for="s1">Nova senha</label>
      <input id="s1" type="password" placeholder="Mínimo 6 caracteres" />
      <label for="s2">Confirmar senha</label>
      <input id="s2" type="password" placeholder="Repita a senha" />
      <button id="btn" onclick="trocar()">Salvar nova senha</button>
    </div>

    <div class="msg" id="msg"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://hulydzwtxomswogbdnap.supabase.co';
    const SUPABASE_ANON_KEY = 'COLE_AQUI_SUA_ANON_KEY';

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const msg = document.getElementById('msg');
    const form = document.getElementById('form');

    // o Supabase coloca o token de recuperação no fragmento da URL (#access_token=...)
    // a lib detecta automaticamente e cria a sessão temporária.
    let pronto = false;
    sb.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') pronto = true;
    });

    async function trocar() {
      const s1 = document.getElementById('s1').value;
      const s2 = document.getElementById('s2').value;
      msg.className = 'msg';
      msg.textContent = '';

      if (s1.length < 6) { msg.className = 'msg erro'; msg.textContent = 'A senha precisa ter ao menos 6 caracteres.'; return; }
      if (s1 !== s2) { msg.className = 'msg erro'; msg.textContent = 'As senhas não coincidem.'; return; }

      const btn = document.getElementById('btn');
      btn.disabled = true; btn.textContent = 'Salvando...';

      const { error } = await sb.auth.updateUser({ password: s1 });

      btn.disabled = false; btn.textContent = 'Salvar nova senha';

      if (error) {
        msg.className = 'msg erro';
        msg.textContent = 'Não foi possível redefinir. O link pode ter expirado — peça um novo no app.';
        return;
      }
      form.style.display = 'none';
      msg.className = 'msg ok';
      msg.textContent = 'Senha alterada com sucesso! Já pode entrar no app com a nova senha.';
    }
  </script>
</body>
</html>
