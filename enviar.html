<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Enviar notificação — CineMeck</title>
<style>
  :root { --bg:#171722; --card:#1e1e2b; --vermelho:#E50914; --texto:#e8e8ee; --sub:#9b9ba6; --borda:#2a2a3a; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; background:var(--bg); color:var(--texto);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .card {
    width:100%; max-width:460px; background:var(--card);
    border:1px solid var(--borda); border-radius:18px; padding:28px 24px;
  }
  .logo { text-align:center; font-size:26px; font-weight:900; margin-bottom:6px; }
  .logo span { color:var(--vermelho); }
  h1 { font-size:18px; text-align:center; margin:0 0 4px; font-weight:800; }
  .alerta {
    font-size:12px; color:var(--sub); text-align:center; margin:0 0 20px; line-height:1.5;
  }
  label { display:block; font-size:13px; color:var(--sub); margin:14px 0 6px; }
  .opcional { font-size:11px; opacity:.7; }
  .abas { display:flex; gap:8px; margin-top:6px; }
  .abas button {
    flex:1; width:auto; margin:0; padding:10px 6px; font-size:13px; font-weight:700;
    background:#23232f; border:1px solid #33333f; border-radius:10px; color:var(--sub);
  }
  .abas button.on { background:var(--vermelho); border-color:var(--vermelho); color:#fff; }
  .oculto { display:none; }
  .achados { margin-top:10px; border:1px solid #33333f; border-radius:10px; max-height:220px; overflow:auto; }
  .achado { display:flex; align-items:center; gap:9px; padding:10px 12px; cursor:pointer;
            border-bottom:1px solid #262633; }
  .achado:last-child { border-bottom:none; }
  .achado:hover { background:#23232f; }
  .achado .nome { flex:1; font-size:13.5px; }
  .achado .grupo { font-size:10px; font-weight:800; padding:3px 8px; border-radius:999px;
                   background:rgba(229,9,20,.16); color:#ff8a90; }
  .escolhido { display:flex; align-items:center; gap:9px; margin-top:10px;
               background:rgba(34,197,94,.12); border:1px solid rgba(34,197,94,.35);
               border-radius:10px; padding:11px 13px; }
  .escolhido .nome { flex:1; font-size:13.5px; color:#22C55E; font-weight:700; }
  .escolhido button { width:auto; margin:0; padding:4px 9px; font-size:12px; background:none;
                      border:1px solid #33333f; border-radius:8px; color:var(--sub); }
  input, textarea {
    width:100%; background:#15151f; border:1px solid #33333f; border-radius:12px;
    padding:14px; color:#fff; font-size:15px; outline:none; font-family:inherit;
  }
  textarea { min-height:96px; resize:vertical; }
  input:focus, textarea:focus { border-color:var(--vermelho); }
  .contador { font-size:11px; color:var(--sub); text-align:right; margin-top:4px; }
  button {
    width:100%; margin-top:22px; background:var(--vermelho); color:#fff;
    border:none; border-radius:12px; padding:15px; font-size:16px; font-weight:800; cursor:pointer;
  }
  button:disabled { opacity:.55; cursor:default; }
  .msg { font-size:14px; margin-top:16px; min-height:20px; line-height:1.6; white-space:pre-wrap; }
  .ok { color:#22C55E; }
  .erro { color:#ff6b6b; }
  .aviso { color:#F5C518; }
  .previa {
    margin-top:18px; padding:14px; border:1px dashed var(--borda); border-radius:12px;
    background:#15151f;
  }
  .previa .rotulo { font-size:11px; color:var(--sub); margin-bottom:8px; }
  .previa .pTitulo { font-size:14px; font-weight:800; }
  .previa .pMsg { font-size:13px; color:#c9c9d4; margin-top:2px; white-space:pre-wrap; }
  .previa img { max-width:100%; border-radius:8px; margin-top:8px; display:none; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">Cine<span>Meck</span></div>
    <h1>Enviar notificação</h1>
    <p class="alerta">Isto envia um push para <strong>todos</strong> os aparelhos com o app instalado. Não dá para cancelar depois.</p>

    <label for="senha">Senha do painel</label>
    <input id="senha" type="password" autocomplete="current-password" placeholder="••••••••" />

    <label for="titulo">Título</label>
    <input id="titulo" type="text" value="CineMeck" maxlength="60" />

    <label for="mensagem">Mensagem</label>
    <textarea id="mensagem" maxlength="300" placeholder="Ex.: Chegou a nova temporada de..."></textarea>
    <div class="contador"><span id="conta">0</span>/300</div>

    <label for="imagem">Imagem <span class="opcional">— opcional, link http(s)</span></label>
    <input id="imagem" type="url" placeholder="https://..." />

    <label>Ao tocar na notificação <span class="opcional">— opcional</span></label>
    <div class="abas">
      <button type="button" id="abaNada" class="on">Nada</button>
      <button type="button" id="abaLink">Abrir um link</button>
      <button type="button" id="abaConteudo">Abrir conteúdo</button>
    </div>

    <div id="paineLink" class="oculto">
      <label for="link">Link <span class="opcional">— ex.: a página do app na Play Store</span></label>
      <input id="link" type="url" placeholder="https://play.google.com/store/apps/details?id=com.cinemeck.app" />
    </div>

    <div id="paineConteudo" class="oculto">
      <label for="busca">Procure o filme, série ou anime</label>
      <input id="busca" type="text" placeholder="Digite parte do título e aperte Enter" />
      <div id="achados" class="achados oculto"></div>
      <div id="escolhido" class="escolhido oculto">
        <span class="nome" id="escolhidoNome"></span>
        <button type="button" id="btTrocar">trocar</button>
      </div>
    </div>

    <div class="previa">
      <div class="rotulo">Prévia</div>
      <div class="pTitulo" id="pTitulo">CineMeck</div>
      <div class="pMsg" id="pMsg">Sua mensagem aparece aqui.</div>
      <img id="pImg" alt="" />
    </div>

    <button id="botao">Enviar notificação</button>
    <div class="msg" id="msg"></div>
  </div>

<script>
(function () {
  var API = 'https://hulydzwtxomswogbdnap.supabase.co/functions/v1/painel-notificacao';

  var $ = function (id) { return document.getElementById(id); };
  var senha = $('senha'), titulo = $('titulo'), mensagem = $('mensagem'), imagem = $('imagem');
  var botao = $('botao'), msg = $('msg'), conta = $('conta');
  var pTitulo = $('pTitulo'), pMsg = $('pMsg'), pImg = $('pImg');

  function mostrar(texto, classe) {
    msg.textContent = texto;
    msg.className = 'msg ' + (classe || '');
  }

  // Prévia ao vivo: ver o que vai sair antes de disparar para todo mundo
  function atualizarPrevia() {
    pTitulo.textContent = titulo.value.trim() || 'CineMeck';
    pMsg.textContent = mensagem.value.trim() || 'Sua mensagem aparece aqui.';
    conta.textContent = mensagem.value.length;
    var url = imagem.value.trim();
    if (/^https?:\/\//i.test(url)) { pImg.src = url; pImg.style.display = 'block'; }
    else { pImg.removeAttribute('src'); pImg.style.display = 'none'; }
  }
  [titulo, mensagem, imagem].forEach(function (campo) {
    campo.addEventListener('input', atualizarPrevia);
  });
  atualizarPrevia();

  // ---------- destino do toque ----------
  // Três estados exclusivos: nada, link de fora, ou uma tela do app. A rota
  // nunca é digitada — sai da busca, que já devolve /movie/123 ou /series/456.
  var destino = 'nada';
  var rotaEscolhida = '';

  function pintarAbas() {
    $('abaNada').className = destino === 'nada' ? 'on' : '';
    $('abaLink').className = destino === 'link' ? 'on' : '';
    $('abaConteudo').className = destino === 'conteudo' ? 'on' : '';
    $('paineLink').className = destino === 'link' ? '' : 'oculto';
    $('paineConteudo').className = destino === 'conteudo' ? '' : 'oculto';
  }
  function irPara(qual) { destino = qual; pintarAbas(); }
  $('abaNada').addEventListener('click', function () { irPara('nada'); });
  $('abaLink').addEventListener('click', function () { irPara('link'); });
  $('abaConteudo').addEventListener('click', function () { irPara('conteudo'); });

  function limparEscolha() {
    rotaEscolhida = '';
    $('escolhido').className = 'escolhido oculto';
    $('achados').className = 'achados oculto';
    $('busca').value = '';
    $('busca').focus();
  }
  $('btTrocar').addEventListener('click', limparEscolha);

  function buscarConteudo() {
    var termo = $('busca').value.trim();
    if (termo.length < 2) { mostrar('Escreva ao menos 2 letras para buscar.', 'erro'); return; }
    if (!senha.value.trim()) { mostrar('Digite a senha do painel antes de buscar.', 'erro'); senha.focus(); return; }

    mostrar('Procurando...', '');
    fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ senha: senha.value.trim(), acao: 'buscar_conteudo', termo: termo }),
    })
      .then(function (r) { return r.json().catch(function () { return {}; }); })
      .then(function (d) {
        if (!d.ok) { mostrar(d.erro || 'Não deu para buscar.', 'erro'); return; }
        var caixa = $('achados');
        caixa.innerHTML = '';
        if (!(d.achados || []).length) { mostrar('Nada encontrado com esse termo.', 'erro'); caixa.className = 'achados oculto'; return; }
        mostrar('', '');

        d.achados.forEach(function (a) {
          var item = document.createElement('div');
          item.className = 'achado';

          var nome = document.createElement('span');
          nome.className = 'nome';
          nome.textContent = a.titulo + (a.ano ? ' (' + a.ano + ')' : '');

          var grupo = document.createElement('span');
          grupo.className = 'grupo';
          grupo.textContent = a.grupo;

          item.appendChild(nome);
          item.appendChild(grupo);
          item.addEventListener('click', function () {
            rotaEscolhida = a.rota;
            $('escolhidoNome').textContent = a.grupo + ' · ' + a.titulo;
            $('escolhido').className = 'escolhido';
            caixa.className = 'achados oculto';
          });
          caixa.appendChild(item);
        });
        caixa.className = 'achados';
      })
      .catch(function (e) { mostrar('Falha de rede: ' + e, 'erro'); });
  }
  $('busca').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); buscarConteudo(); }
  });

  botao.addEventListener('click', function () {
    var corpo = {
      senha: senha.value.trim(),
      titulo: titulo.value.trim() || 'CineMeck',
      mensagem: mensagem.value.trim(),
      imagem: imagem.value.trim(),
      link: destino === 'link' ? $('link').value.trim() : '',
      rota: destino === 'conteudo' ? rotaEscolhida : '',
    };

    if (!corpo.senha) { mostrar('Digite a senha do painel.', 'erro'); senha.focus(); return; }
    if (!corpo.mensagem) { mostrar('Escreva a mensagem.', 'erro'); mensagem.focus(); return; }
    if (corpo.imagem && !/^https?:\/\//i.test(corpo.imagem)) {
      mostrar('A imagem precisa ser um link começando com http:// ou https://', 'erro');
      imagem.focus(); return;
    }

    if (destino === 'link' && !/^https?:\/\//i.test(corpo.link)) {
      mostrar('O link precisa começar com http:// ou https://', 'erro');
      $('link').focus(); return;
    }
    if (destino === 'conteudo' && !corpo.rota) {
      mostrar('Procure e escolha o conteúdo na lista.', 'erro');
      $('busca').focus(); return;
    }

    // Envio atinge todos os usuários e não tem volta: confirma antes.
    var aondeVai = corpo.rota
      ? '\n\nAo tocar: abre ' + $('escolhidoNome').textContent
      : corpo.link
        ? '\n\nAo tocar: abre ' + corpo.link
        : '';
    if (!confirm('Enviar esta notificação para TODOS os usuários?\n\n' + corpo.titulo + '\n' + corpo.mensagem + aondeVai)) return;

    botao.disabled = true;
    mostrar('Enviando...', '');

    fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(corpo),
    })
      .then(function (r) { return r.json().catch(function () { return {}; }); })
      .then(function (d) {
        if (d.ok) {
          var linhas = ['Enviada.'];
          if (d.enviados != null) linhas.push('Entregues: ' + d.enviados);
          if (d.falhas) linhas.push('Falhas: ' + d.falhas);
          if (d.removidos) linhas.push('Tokens removidos: ' + d.removidos);
          if (d.aviso) linhas.push(d.aviso);
          mostrar(linhas.join('\n'), 'ok');
          mensagem.value = ''; imagem.value = '';
          atualizarPrevia();
        } else {
          // a função devolve ok:false também quando salva no sino mas o push
          // não sai (falta chave do Firebase) -- por isso a cor de aviso
          mostrar(d.erro || 'Não deu para enviar.', d.inbox_id ? 'aviso' : 'erro');
        }
      })
      .catch(function (e) {
        mostrar('Erro de rede: ' + e + '\nConfira sua conexão e tente de novo.', 'erro');
      })
      .then(function () { botao.disabled = false; });
  });
})();
</script>
</body>
</html>
